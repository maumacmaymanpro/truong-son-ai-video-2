services:
  - type: web
    name: truong-son-ai-video-2
    env: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_TRANSCRIBE_MODEL
        value: whisper-1
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: AI_BG_MAX
        value: "6"
      - key: JOB_RETENTION_HOURS
        value: "24"
      - key: MAX_UPLOAD_MB
        value: "300"
